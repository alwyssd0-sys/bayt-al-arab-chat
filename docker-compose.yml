version: '3.9'

services:
  mongo:
    image: mongo:6
    container_name: bayt-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: bayt-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/bayt-chat
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: bayt-frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo_data:
